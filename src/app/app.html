<div class="container-fluid vh-100 overflow-hidden p-0">
  <div class="row g-0 h-100">
    <div class="col-auto d-none d-md-block h-100">
      <app-sidebar></app-sidebar>
    </div>

    <div class="col-12 col-md h-100 overflow-hidden">
      <app-todo-list
        class="d-block h-100"
        [searchTerm]="searchTerm()"
        (searchTermChange)="searchTerm.set($event)"
      >
      </app-todo-list>
    </div>

    <div class="col-12 col-md-auto h-100">
      <app-create-task class="d-block h-100" (formFocused)="searchTerm.set('')"> </app-create-task>
    </div>
  </div>
</div>
