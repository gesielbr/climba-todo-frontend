<div class="page-scroll">
  <section class="container-fluid app-layout">
    <div class="d-flex flex-column min-vh-100">
      <!-- Conteúdo principal -->
      <div class="row g-0 flex-grow-1">
        <div class="col-12 col-sm-1">
          <app-sidebar></app-sidebar>
        </div>

        <div class="col-12 col-sm-6 col-md-7 col-lg-7 col-xl-7">
          <app-todo-list
            [searchTerm]="searchTerm()"
            (searchTermChange)="searchTerm.set($event)"
          ></app-todo-list>
        </div>

        <div class="col-12 col-sm-5 col-md-4 col-lg-4 col-xl-4">
          <app-create-task (formFocused)="searchTerm.set('')"></app-create-task>
        </div>
      </div>

      <!-- Footer -->
      <app-footer class="mt-auto"></app-footer>
    </div>
  </section>
</div>
