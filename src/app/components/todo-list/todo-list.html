<div class="todo-list-container p-4 h-100">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0">Lista de Tarefas</h3>
      <p class="date-label mb-0">{{ hoje | date: 'EEEE d' | capitalize }}</p>
    </div>
  </header>

  <!-- Campo de busca -->
  <div class="search-box mb-3">
    <i class="bi bi-search search-icon"></i>
    <input
      type="search"
      class="form-control search-input"
      placeholder="Pesquisar tarefas..."
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearchInput($event)"
    />
  </div>

  @if (todoService.loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-light" role="status"></div>
    </div>
  } @else {
    <div class="list">
      @for (todo of filteredTodos(); track todo.id; let i = $index) {
        <app-todo-card
          [todo]="todo"
          [isActive]="i === 0"
          (onToggle)="toggleTodo($event)"
          (onDelete)="deleteTodo($event)"
          (onEdit)="editTodo($event)"
        >
        </app-todo-card>
      } @empty {
        <p class="text-center">Nenhuma tarefa encontrada.</p>
      }
    </div>
  }
</div>
