<div class="todo-list-container p-4">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <div>
      @if (userService.name()) {
        <div class="user-greeting">
          <span class="user-greeting-avatar" aria-hidden="true">
            {{ greetingInitial() }}
          </span>

          <span class="user-greeting-text">
            Olá,
            <strong class="user-greeting-name" [title]="userService.name()">
              {{ userService.name() }}
            </strong>
          </span>

          <span class="user-greeting-wave" aria-hidden="true">👋</span>
        </div>
      }

      <p class="date-label mb-0 mt-4">{{ hojeFormatada() }}</p>
    </div>
  </header>

  <!-- Campo de busca -->
  <div class="search-box mb-3">
    <i class="bi bi-search search-icon"></i>
    <input
      type="search"
      class="form-control search-input"
      placeholder="Pesquisar tarefas..."
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearchInput($event)"
    />
  </div>

  @if (todoService.loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-light" role="status"></div>
    </div>
  } @else {
    <div class="list">
      @for (todo of filteredTodos(); track todo.id; let i = $index) {
        <app-todo-card
          [todo]="todo"
          [isActive]="i === 0"
          (onToggle)="toggleTodo($event)"
          (onDelete)="deleteTodo($event)"
          (onEdit)="editTodo($event)"
        >
        </app-todo-card>
      } @empty {
        <p class="text-center">Nenhuma tarefa encontrada.</p>
      }
    </div>
  }
</div>
