<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <!-- Identificação da aplicação -->
    <title>Limba Todo | Gerenciador de tarefas</title>

    <meta
      name="description"
      content="Organize suas tarefas, acompanhe suas prioridades e gerencie sua produtividade com o Limba Todo."
    />

    <meta name="application-name" content="Limba Todo" />

    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Compatibilidade e renderização -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Aparência do navegador -->
    <meta name="theme-color" content="#1a1b26" />
    <meta name="color-scheme" content="dark" />

    <!-- Indexação -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Limba Todo" />
    <meta property="og:title" content="Limba Todo | Gerenciador de tarefas" />
    <meta
      property="og:description"
      content="Organize suas tarefas e acompanhe sua produtividade com o Limba Todo."
    />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Limba Todo | Gerenciador de tarefas" />
    <meta
      name="twitter:description"
      content="Organize suas tarefas e acompanhe sua produtividade."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fontes: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
